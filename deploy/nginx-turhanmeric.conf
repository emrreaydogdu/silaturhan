server {
    listen 80;
    server_name turhanmeric.com www.turhanmeric.com;
    root /var/www/turhanmeric/current;
    index index.html;

    add_header Cache-Control "no-cache" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /multisport {
        try_files /multisport/index.html =404;
    }

    location = /uzm-fzt-silasu-arikan {
        try_files /uzm-fzt-silasu-arikan/index.html =404;
    }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name turhanmeric.com www.turhanmeric.com;
    root /var/www/turhanmeric/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/turhanmeric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turhanmeric.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Cache-Control "no-cache" always;

    location = /multisport {
        try_files /multisport/index.html =404;
    }

    location = /uzm-fzt-silasu-arikan {
        try_files /uzm-fzt-silasu-arikan/index.html =404;
    }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
