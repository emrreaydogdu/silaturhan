server {
    listen 80;
    server_name turhanmeric.com www.turhanmeric.com;
    root /var/www/turhanmeric/current;
    index index.html;

    add_header Cache-Control "no-cache" always;

    client_max_body_size 100M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /images/uploads/ {
        alias /var/www/turhanmeric/app/public/images/uploads/;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /videos/uploads/ {
        alias /var/www/turhanmeric/app/public/videos/uploads/;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /videos/ {
        alias /var/www/turhanmeric/current/videos/;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /multisport {
        try_files /multisport/index.html =404;
    }

    location = /uzm-fzt-silasu-arikan {
        try_files /uzm-fzt-silasu-arikan/index.html =404;
    }

    location = /fzt-tilbe-meric {
        try_files /fzt-tilbe-meric/index.html =404;
    }

    location = /uzmanlar {
        try_files /uzmanlar/index.html =404;
    }

    location = /kvkk {
        try_files /kvkk/index.html =404;
    }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name turhanmeric.com www.turhanmeric.com;
    root /var/www/turhanmeric/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/turhanmeric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turhanmeric.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
